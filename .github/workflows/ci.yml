name: C++ checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS AppleClang
            os: macos-14
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2022
            cc: ''
            cxx: ''
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DDECRAMPEQ_BUILD_TESTS=ON -DDECRAMPEQ_BUILD_EXAMPLE=ON
          -DDECRAMPEQ_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test including relocated package consumers
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DDECRAMPEQ_BUILD_TESTS=ON -DDECRAMPEQ_WARNINGS_AS_ERRORS=ON
          -DDECRAMPEQ_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
